# Review claims: `claim` / `disclaim` commands on a pull request.
#
# To avoid two reviewers (human or AI) picking up the same PR, a reviewer says
# what they intend to review and claims it:
#
#   claim              -- claim this PR for review, for the default window
#   claim 5 days       -- ... for a specific window (hours / days / weeks)
#   claim 2026-08-01   -- ... until a specific date
#   disclaim           -- release the claim early
#
# The bot assigns the claimant, applies the `review-claimed` label and keeps a
# single status comment recording the deadline.  Claiming again extends the
# window; submitting a review completes the claim.  Stale claims are released
# automatically by `review_claim_expiry.yml`, so nothing stays blocked forever.
#
# A claim is cooperative, not a lock: it signals intent so that others can steer
# around it, and anyone remains free to review the PR.
#
# As in `labels_from_comment.yml`, a command is a whole line of the comment, so
# that a comment merely discussing claims does not trigger one.  Commands need
# no repository permissions -- anyone can claim a review.

name: Review claims

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Limit permissions for GITHUB_TOKEN for the entire workflow
permissions:
  contents: read
  issues: write # Only allow issue/PR comments, labels and reactions
  pull-requests: write # Only allow PR comments/labels/assignees
  # All other permissions are implicitly 'none'

jobs:
  command:
    name: Handle claim command
    runs-on: ubuntu-latest
    # Cheap prefilter: only comments on PRs, and only ones that mention a command
    # at all, reach the checkout below.  `disclaim` contains `claim`, so one test
    # covers both; the capitalised variant is here because expressions have no
    # case-insensitive compare, while the parser itself accepts any casing.
    # Don't run on forks, where we wouldn't have permission to act on the PR anyway.
    if: >-
      github.repository == 'leanprover-community/physlib' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, 'claim') ||
       contains(github.event.comment.body, 'Claim'))
    steps:
      - name: Check out the claim helpers
        uses: actions/checkout@v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Claim or disclaim
        uses: actions/github-script@v7
        with:
          script: |
            const claims = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-claim.js`);
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const target = { owner, repo, issue_number };
            const actor = context.payload.comment.user.login;
            const commentId = context.payload.comment.id;
            const now = Date.now();

            const command = claims.parseCommand(context.payload.comment.body);
            if (!command) {
              core.info('No claim command in this comment.');
              return;
            }

            const react = content => github.rest.reactions.createForIssueComment({
              owner, repo, comment_id: commentId, content,
            }).catch(error => core.warning(`Could not react: ${error.message}`));

            const reject = async message => {
              await react('confused');
              await github.rest.issues.createComment({
                owner, repo, issue_number, body: `@${actor} ${message}`,
              });
            };

            const statusComment = await claims.findStatusComment(github, target);
            const current = claims.readClaim(statusComment);
            const active = current && current.state === 'active' ? current : null;

            if (command.name === 'disclaim') {
              if (!active) {
                core.info(`#${issue_number}: nothing to disclaim.`);
                await react('confused');
                return;
              }
              // The claimant can always let go; a maintainer can release someone
              // else's claim without waiting for it to time out.
              let permitted = active.claimant === actor;
              if (!permitted) {
                const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner, repo, username: actor,
                }).catch(() => ({ data: { permission: 'none' } }));
                permitted = ['admin', 'maintain', 'write'].includes(access.permission);
              }
              if (!permitted) {
                await reject(
                  `this PR is claimed by @${active.claimant} until ${claims.formatUTC(active.until)}, ` +
                  'and only they (or a maintainer) can release it. It will be released ' +
                  'automatically if no review arrives by then.');
                return;
              }

              core.info(`#${issue_number}: ${actor} released the claim held by ${active.claimant}.`);
              await claims.releaseClaim(github, core, target, active.claimant);
              await claims.writeStatus(github, target,
                { ...active, state: 'released', releasedBy: actor }, statusComment);
              await react('+1');
              return;
            }

            // Someone else's live claim is not silently overwritten: the point of
            // the whole mechanism is that a second reviewer finds out before
            // duplicating the work.
            if (active && active.claimant !== actor) {
              await reject(
                `this PR is already claimed by @${active.claimant} until ` +
                `${claims.formatUTC(active.until)}. It will be released automatically if no ` +
                'review arrives by then, and you are still free to review it in the meantime ' +
                '— a claim signals intent rather than locking anyone out.');
              return;
            }

            const window = claims.parseWindow(command.argument, now);
            if (window.error) {
              await reject(window.error);
              return;
            }

            const claim = {
              state: 'active',
              claimant: actor,
              // Extending keeps the original claim time, so the status comment
              // keeps describing the window the claimant actually asked for.
              claimedAt: now,
              until: window.until,
            };

            await claims.takeClaim(github, core, target, actor);
            await claims.writeStatus(github, target, claim, statusComment);
            await react('+1');

            if (window.clamped) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: `@${actor} that window was longer than the ` +
                  `${claims.describeWindow(claims.MAX_WINDOW_MS)} maximum, so I shortened it to ` +
                  `${claims.formatUTC(window.until)}. Comment \`claim\` again to extend it later.`,
              });
            }
            core.info(`#${issue_number}: ${actor} claimed until ${new Date(window.until).toISOString()}.`);

  complete:
    name: Complete claim on review
    runs-on: ubuntu-latest
    # Don't run on forks, where we wouldn't have permission to act on the PR anyway.
    if: >-
      github.repository == 'leanprover-community/physlib' &&
      github.event_name == 'pull_request_review'
    steps:
      - name: Check out the claim helpers
        uses: actions/checkout@v7.0.0
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Clear the claim once its claimant has reviewed
        uses: actions/github-script@v7
        with:
          script: |
            const claims = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/review-claim.js`);
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const target = { owner, repo, issue_number };
            const reviewer = context.payload.review.user.login;

            const statusComment = await claims.findStatusComment(github, target);
            const current = claims.readClaim(statusComment);
            if (!current || current.state !== 'active' || current.claimant !== reviewer) {
              core.info(`#${issue_number}: review by ${reviewer} does not close an active claim.`);
              return;
            }

            core.info(`#${issue_number}: ${reviewer} reviewed, completing their claim.`);
            // The label goes, but the assignee stays: they are engaged with this
            // PR now, which is the opposite of the case the expiry job handles.
            await claims.releaseClaim(github, core, target, null);
            await claims.writeStatus(github, target,
              { ...current, state: 'completed' }, statusComment);
