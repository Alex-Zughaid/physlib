
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

name: Style linters

jobs:
  alpha_build:
    name: Lean based style linters
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          set -o pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- --default-toolchain none -y
          ~/.elan/bin/lean --version
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: check versions
        run: |
          lean --version
          lake --version

      - name: build cache
        run: |
          lake exe cache get

      - name: build PhyslibAlpha
        id: build
        uses: liskin/gh-problem-matcher-wrap@v3
        with:
          linters: gcc
          run: |
            bash -o pipefail -c "env LEAN_ABORT_ON_PANIC=1 lake build -KCI PhyslibAlpha | tee stdout.log"

      # PhyslibAlpha is not a default target, so build.yml never builds it.
      # Publishing from here keeps both workflows free of extra build work.
      # Uploads to the same rolling release as build.yml, as a separate asset.
      - name: publish build cache
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          cd .lake/build/lib/lean
          # Check both the module subtree and the root-module artifacts. Without
          # these guards an unmatched glob below fails tar with a cryptic
          # "Cannot stat" rather than saying what is actually missing.
          test -d PhyslibAlpha || { echo "::error::PhyslibAlpha build output missing"; exit 1; }
          test -f PhyslibAlpha.olean || { echo "::error::PhyslibAlpha root module artifacts missing"; exit 1; }

          cat > .physlibalpha-cache-info <<EOF
          commit=${{ github.sha }}
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          toolchain=$(cat "$GITHUB_WORKSPACE/lean-toolchain")
          EOF

          tar -czf "$GITHUB_WORKSPACE/physlibalpha-cache.tar.gz" \
            .physlibalpha-cache-info PhyslibAlpha PhyslibAlpha.*

          cd "$GITHUB_WORKSPACE"

          # This workflow and build.yml both run on the same push and race to
          # create the release, so losing the race is not an error -- but a
          # genuine failure (e.g. missing permissions) still has to surface.
          if ! gh release view cache-master >/dev/null 2>&1; then
            gh release create cache-master \
              --prerelease \
              --title "Build cache (master)" \
              --notes "Prebuilt Lean artifacts for the tip of master, refreshed on every merge. Fetch with \`scripts/get-cache.sh\`. This is a build cache, not a Physlib release." \
              || gh release view cache-master >/dev/null 2>&1 \
              || { echo "::error::could not create or locate the cache-master release"; exit 1; }
          fi

          gh release upload cache-master physlibalpha-cache.tar.gz --clobber

      - name: runLinter on PhyslibAlpha
        if: ${{ always() && steps.build.outcome == 'success' || steps.build.outcome == 'failure' }}
        id: lint
        uses: liskin/gh-problem-matcher-wrap@v3
        timeout-minutes: 4
        with:
          linters: gcc
          run: env LEAN_ABORT_ON_PANIC=1 lake exe runPhyslibAlphaLinters

      - name: Check no PhyslibAlpha in Physlib and QuantumInfo
        run: env LEAN_ABORT_ON_PANIC=1 lake exe noAlphaImports

      - name: Check PhyslibAlpha imports
        run: env LEAN_ABORT_ON_PANIC=1 lake exe alphaFileImports


  style_lint:
    name: Python based linters
    runs-on: ubuntu-latest
    steps:
      - name: cleanup
        run: |
          find . -name . -o -prune -exec rm -rf -- {} +

      - uses: actions/checkout@v4

      # Run the case checker action
      - name: Check Case Sensitivity
        uses: credfeto/action-case-checker@v1.3.0

      - name: Look for ignored files
        uses: credfeto/action-no-ignored-files@v1.1.0

      - name: install Python
        if: ${{ 'ubuntu-latest' == 'ubuntu-latest' }}
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Python linters for PhyslibAlpha
        run: |
          chmod u+x scripts/PhyslibAlpha/alphaPythonLinters.sh
          ./scripts/PhyslibAlpha/alphaPythonLinters.sh
