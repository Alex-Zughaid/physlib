# Generates last month's commit diff + contributor/line-count summary for the
# physlib-website "Monthly Updates" page (see monthly-diffs/ and
# scripts/generate_monthly_diff.py). Runs on this fork so it can commit and
# push the result with the default GITHUB_TOKEN.

name: Generate monthly diff

on:
  schedule:
    - cron: "0 3 1 * *" # 03:00 UTC on the 1st of each month - covers the month that just ended
  workflow_dispatch:
    inputs:
      month:
        description: "Month to generate, as YYYY-MM (defaults to last month)"
        required: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream (leanprover-community/physlib)
        run: |
          git remote add upstream https://github.com/leanprover-community/physlib.git
          git fetch upstream master

      - name: Generate diff and update index
        run: python3 scripts/generate_monthly_diff.py ${{ github.event.inputs.month }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add monthly-diffs/
          git commit -m "Add monthly diff for ${{ github.event.inputs.month }}" || git commit -m "Add monthly diff" || echo "No changes to commit"
          git push
